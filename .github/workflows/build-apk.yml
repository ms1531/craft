name: Build ArtCraft Android APK

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Choose the ArtCraft app"
        required: true
        type: choice
        default: vectorcraft
        options:
          - vectorcraft
          - photocraft
          - filmcraft
          - lightcraft
          - pdfcraft
          - effectcraft
          - designcraft
          - figcraft
          - wordcraft
          - soundcraft
          - deckcraft
          - cadcraft
          - gridcraft
      build_mode:
        description: "APK build type"
        required: true
        type: choice
        default: release
        options:
          - release
          - debug

permissions:
  contents: read

concurrency:
  group: artcraft-apk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract uploaded source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "::error::No .zip file found in the repository root."
            exit 1
          fi
          mkdir -p work
          unzip -q "$ZIP" -d work
          ROOT="$(find work -mindepth 1 -maxdepth 4 -type f -name build.sh -printf '%h\n' | head -n 1)"
          if [ -z "$ROOT" ]; then
            echo "::error::Could not find build.sh inside the uploaded ZIP."
            find work -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "ARTCRAFT_ROOT=$GITHUB_WORKSPACE/$ROOT" >> "$GITHUB_ENV"
          echo "Found builder at: $ROOT"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ARTCRAFT_TARGET_SDK=35" >> "$GITHUB_ENV"
          echo "ARTCRAFT_BUILD_TOOLS_VERSION=35.0.0" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake curl git unzip zip pkg-config libssl-dev

      - name: Set up Rust with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build selected APK
        shell: bash
        env:
          APP: ${{ inputs.app }}
          BUILD_MODE: ${{ inputs.build_mode }}
        run: |
          set -Eeuo pipefail
          cd "$ARTCRAFT_ROOT"
          python3 --version
          rustc --version
          cargo --version
          if [ "$BUILD_MODE" = "debug" ]; then
            bash build-debug.sh "-$APP"
          else
            bash build.sh "-$APP"
          fi

      - name: Upload APKs and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artcraft-${{ inputs.app }}-${{ inputs.build_mode }}
          path: |
            work/**/output/*.apk
            work/**/logs/**
          if-no-files-found: warn
          retention-days: 14
          
